services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    depends_on:
      mongo: { condition: service_healthy }
    environment:
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/greenmart
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      DELIVERY_FEE_CENTS: ${DELIVERY_FEE_CENTS:-0}
      STORE_NAME: ${STORE_NAME:-GreenMart}
      STORE_ADDRESS: ${STORE_ADDRESS:-}
      STORE_PHONE: ${STORE_PHONE:-}

  web:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports: ["8080:80"]

volumes:
  mongo-data:
